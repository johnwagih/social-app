<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#101210] px-5 py-12 text-white"
>
  <!-- Background Effects -->
  <div
    class="pointer-events-none absolute -left-32 -top-32 h-96 w-96 rounded-full bg-[#D7F36B]/[0.04] blur-[120px]"
  ></div>

  <div
    class="pointer-events-none absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-[#D7F36B]/[0.04] blur-[120px]"
  ></div>

  <!-- Main Content -->
  <section class="relative z-10 mx-auto w-full max-w-2xl text-center">
    <!-- Logo -->
    <div class="mb-12 flex items-center justify-center gap-3">
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#D7F36B] text-xl font-black text-[#101210]"
      >
        K
      </div>

      <span class="text-2xl font-black tracking-[0.2em]"> KINORA </span>
    </div>

    <!-- 404 Illustration -->
    <div class="relative mb-8">
      <div
        class="select-none text-[150px] font-black leading-none tracking-tighter text-[#D7F36B]/[0.08] sm:text-[220px]"
      >
        404
      </div>

      <div class="absolute inset-0 flex items-center justify-center">
        <div
          class="flex h-24 w-24 items-center justify-center rounded-[2rem] border border-[#D7F36B]/20 bg-[#191C19] shadow-[0_0_60px_rgba(215,243,107,0.08)] sm:h-28 sm:w-28"
        >
          <i class="fa-solid fa-compass text-4xl text-[#D7F36B] sm:text-5xl"></i>
        </div>
      </div>
    </div>

    <!-- Text -->
    <div class="mb-9">
      <span
        class="mb-4 inline-block rounded-full border border-[#D7F36B]/20 bg-[#D7F36B]/[0.06] px-4 py-2 text-xs font-bold uppercase tracking-[0.2em] text-[#D7F36B]"
      >
        {{ 'notFound.pageNotFound' | translate }}
      </span>

      <h1 class="mb-4 text-3xl font-black tracking-tight sm:text-5xl">
        {{ 'notFound.heading' | translate }} <span class="text-[#D7F36B]">{{ 'notFound.headingHighlight' | translate }}</span>
      </h1>

      <p class="mx-auto max-w-md text-sm leading-7 text-[#A1A69F] sm:text-base">
        {{ 'notFound.description' | translate }}
      </p>
    </div>

    <!-- Actions -->
    <div class="flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a
        routerLink="/feed"
        class="flex w-full items-center justify-center gap-3 rounded-xl bg-[#D7F36B] px-7 py-4 text-sm font-black text-[#101210] transition-all duration-300 hover:-translate-y-1 hover:bg-[#e4ff83] hover:shadow-[0_10px_35px_rgba(215,243,107,0.15)] sm:w-auto"
      >
        <i class="fa-solid fa-house"></i>
        {{ 'notFound.backToHome' | translate }}
      </a>

      <button
        type="button"
        onclick="history.back()"
        class=" cursor-pointer flex w-full items-center justify-center gap-3 rounded-xl border border-white/[0.08] bg-[#191C19] px-7 py-4 text-sm font-bold text-white transition-all duration-300 hover:border-[#D7F36B]/30 hover:bg-[#202420] sm:w-auto"
      >
        <i class="fa-solid fa-arrow-left"></i>
        {{ 'notFound.goBack' | translate }}
      </button>
    </div>

    <!-- Footer -->
    <p class="mt-16 text-xs font-medium tracking-wide text-[#62675F]">
      © 2026 KINORA. {{ 'notFound.footer' | translate }}
    </p>
  </section>
</main>
