<aside class="hidden lg:block">
  <!-- User Mini Profile -->
  <section class="mb-9">
    <div class="flex items-center gap-3">
      <img
        [src]="userData().photo"
        [alt]="userData().name"
        class="h-12 w-12 rounded-2xl object-cover"
      />

      <div class="min-w-0">
        <h2 class="truncate text-sm font-bold text-white">{{ userData().name }}</h2>

        <p class="mt-1 truncate text-xs text-gray-500">@{{ userData().username }}</p>
      </div>
    </div>
  </section>

  <!-- Sidebar Navigation -->
  <nav [attr.aria-label]="'sidebar.feedAriaLabel' | translate">
    <p class="mb-4 px-3 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-600">
      {{ 'sidebar.menu' | translate }}
    </p>

    <div class="space-y-2">
      <!-- Active item -->
      <!-- Home Feed -->
      <button routerLink="/feed" class="cursor-pointer">
        <a
          class="flex items-center gap-4 rounded-xl bg-[#D7F36B] px-4 py-3.5 text-sm font-bold text-[#171914] shadow-[0_8px_30px_rgba(215,243,107,0.07)]"
        >
          <i class="fa-solid fa-house w-4 text-center"></i>
          {{ 'sidebar.homeFeed' | translate }}
        </a>
      </button>

      <!-- My Profile -->
      <button class="cursor-pointer">
        <a
          class="flex items-center gap-4 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-400 transition hover:bg-white/[0.04] hover:text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sparkles"
            aria-hidden="true"
          >
            <path
              d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
            ></path>
            <path d="M20 2v4"></path>
            <path d="M22 4h-4"></path>
            <circle cx="4" cy="20" r="2"></circle>
          </svg>
          {{ 'sidebar.myPosts' | translate }}
        </a>
      </button>

      <!-- Saved Posts -->
      <button routerLink="/saveposts" class="cursor-pointer">
        <a
          class="flex items-center gap-4 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-400 transition hover:bg-white/[0.04] hover:text-white"
        >
          <i class="fa-regular fa-bookmark w-4 text-center"></i>
          {{ 'sidebar.savedPosts' | translate }}
        </a>
      </button>

      <!-- Community -->
      <button routerLink="/feed" class="cursor-pointer">
        <a
          class="flex items-center gap-4 rounded-xl px-4 py-3.5 text-sm font-medium text-gray-400 transition hover:bg-white/[0.04] hover:text-white"
        >
          <i class="fa-solid fa-house w-4 text-center"></i>
          {{ 'sidebar.community' | translate }}
        </a>
      </button>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="mt-12 border-t border-white/[0.07] pt-5">
    <p class="text-xs leading-6 text-gray-600">
      {{ 'sidebar.footer' | translate }}
    </p>

    <p class="mt-3 text-[10px] font-medium text-gray-700">© 2026 KINORA</p>
  </div>
</aside>
